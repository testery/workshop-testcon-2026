name: CI

on:
  pull_request:
  push:
    branches: [main]

jobs:
  migrations:
    name: Database migrations (Flyway)
    runs-on: ubuntu-24.04
    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_DB: example_webapp
          POSTGRES_USER: example_webapp
          POSTGRES_PASSWORD: example_webapp
        ports: ["5432:5432"]
        options: >-
          --health-cmd "pg_isready -U example_webapp"
          --health-interval 5s --health-timeout 5s --health-retries 10
    steps:
      - uses: actions/checkout@v4
      - name: Apply every migration to an empty database, then prove a second run is a no-op
        run: |
          run_flyway() { docker run --rm --network host -v "$PWD/db/migrations:/flyway/sql" flyway/flyway:11-alpine             -url=jdbc:postgresql://localhost:5432/example_webapp -user=example_webapp -password=example_webapp "$@"; }
          run_flyway migrate
          run_flyway validate
          run_flyway info

  api-unit-tests:
    name: API unit tests (pytest)
    runs-on: ubuntu-24.04
    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_DB: example_webapp
          POSTGRES_USER: example_webapp
          POSTGRES_PASSWORD: example_webapp
        ports: ["5432:5432"]
        options: >-
          --health-cmd "pg_isready -U example_webapp"
          --health-interval 5s --health-timeout 5s --health-retries 10
    env:
      DATABASE_URL: postgres://example_webapp:example_webapp@localhost:5432/example_webapp
      SECRET_KEY: ci
      DEBUG: "1"
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: api/requirements-dev.txt
      - run: pip install -r api/requirements-dev.txt
      - run: pytest -q
        working-directory: api

  web-unit-tests:
    name: Web unit tests (vitest + tsc)
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: npm
          cache-dependency-path: web/package-lock.json
      - run: npm ci
        working-directory: web
      - run: npm run build
        working-directory: web
      - run: npm test
        working-directory: web
