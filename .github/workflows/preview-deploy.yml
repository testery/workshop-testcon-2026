name: Preview Environment

on:
  pull_request:
    types: [opened, synchronize, reopened]

# A new push to the same PR cancels the previous deploy instead of racing it.
concurrency:
  group: preview-${{ github.event.pull_request.number }}
  cancel-in-progress: true

permissions:
  contents: read
  id-token: write      # lets the job assume the AWS role via OIDC (no long-lived keys)
  pull-requests: write # lets the job comment the preview URL on the PR

env:
  AWS_REGION: us-east-1
  ECR_REGISTRY: ${{ vars.ECR_REGISTRY }}
  EKS_CLUSTER: ${{ vars.EKS_CLUSTER }}
  PREVIEW_DOMAIN: ${{ vars.PREVIEW_DOMAIN }}

jobs:
  build:
    name: Build and push images
    runs-on: ubuntu-24.04
    outputs:
      namespace: ${{ steps.names.outputs.namespace }}
      host: ${{ steps.names.outputs.host }}
      api_image: ${{ steps.names.outputs.api_image }}
      web_image: ${{ steps.names.outputs.web_image }}
      migrations_image: ${{ steps.names.outputs.migrations_image }}
      sha_short: ${{ steps.names.outputs.sha_short }}
    steps:
      - uses: actions/checkout@v4

      - name: Work out the environment name
        id: names
        env:
          BRANCH: ${{ github.head_ref }}
          SHA: ${{ github.event.pull_request.head.sha }}
        run: |
          # Branch name -> a valid DNS label: lowercase, [a-z0-9-], max 40 chars.
          SAFE=$(echo "$BRANCH" | tr '[:upper:]' '[:lower:]' | sed -E 's/[^a-z0-9]+/-/g; s/^-+//' | cut -c1-40 | sed -E 's/-+$//')
          SHA_SHORT=${SHA::7}
          echo "namespace=pr-${{ github.event.pull_request.number }}" >> "$GITHUB_OUTPUT"
          echo "host=${SAFE}.${PREVIEW_DOMAIN}" >> "$GITHUB_OUTPUT"
          echo "api_image=${ECR_REGISTRY}/workshop-testcon-2026/api:${SHA_SHORT}" >> "$GITHUB_OUTPUT"
          echo "web_image=${ECR_REGISTRY}/workshop-testcon-2026/web:${SHA_SHORT}" >> "$GITHUB_OUTPUT"
          echo "migrations_image=${ECR_REGISTRY}/workshop-testcon-2026/migrations:${SHA_SHORT}" >> "$GITHUB_OUTPUT"
          echo "sha_short=${SHA_SHORT}" >> "$GITHUB_OUTPUT"
          echo "Preview will be https://${SAFE}.${PREVIEW_DOMAIN} in namespace pr-${{ github.event.pull_request.number }}"

      - name: Authenticate to AWS
        uses: aws-actions/configure-aws-credentials@v4
        with:
          role-to-assume: ${{ vars.AWS_ROLE_ARN }}
          aws-region: ${{ env.AWS_REGION }}

      - name: Log in to Amazon ECR
        uses: aws-actions/amazon-ecr-login@v2

      - uses: docker/setup-buildx-action@v3

      - name: Build and push the API image
        uses: docker/build-push-action@v6
        with:
          context: ./api
          push: true
          tags: ${{ steps.names.outputs.api_image }}
          cache-from: type=gha,scope=api
          cache-to: type=gha,mode=max,scope=api

      - name: Build and push the web image
        uses: docker/build-push-action@v6
        with:
          context: ./web
          push: true
          tags: ${{ steps.names.outputs.web_image }}
          cache-from: type=gha,scope=web
          cache-to: type=gha,mode=max,scope=web

      - name: Build and push the migrations image (Flyway + db/migrations)
        uses: docker/build-push-action@v6
        with:
          context: ./db
          push: true
          tags: ${{ steps.names.outputs.migrations_image }}

  deploy:
    name: Deploy preview environment
    needs: build
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4

      - name: Authenticate to AWS
        uses: aws-actions/configure-aws-credentials@v4
        with:
          role-to-assume: ${{ vars.AWS_ROLE_ARN }}
          aws-region: ${{ env.AWS_REGION }}

      - name: Point kubectl at the cluster
        run: aws eks update-kubeconfig --name "$EKS_CLUSTER" --region "$AWS_REGION"

      - name: Create or update the environment
        env:
          NAMESPACE: ${{ needs.build.outputs.namespace }}
          HOST: ${{ needs.build.outputs.host }}
          API_IMAGE: ${{ needs.build.outputs.api_image }}
          WEB_IMAGE: ${{ needs.build.outputs.web_image }}
          MIGRATIONS_IMAGE: ${{ needs.build.outputs.migrations_image }}
          GIT_SHA_SHORT: ${{ needs.build.outputs.sha_short }}
          PR_NUMBER: ${{ github.event.pull_request.number }}
          BRANCH: ${{ github.head_ref }}
          CERT_ARN: ${{ vars.PREVIEW_CERT_ARN }}
        run: |
          # envsubst fills in the ${...} placeholders; kubectl apply is idempotent, so the
          # same command creates the environment the first time and updates it after that.
          for f in k8s/preview/*.yaml; do envsubst < "$f"; echo "---"; done | kubectl apply -f -

      - name: Wait for the database migration
        run: kubectl -n "${{ needs.build.outputs.namespace }}" wait --for=condition=complete --timeout=600s "job/migrate-${{ needs.build.outputs.sha_short }}"

      - name: Wait for the rollout
        run: |
          kubectl -n "${{ needs.build.outputs.namespace }}" rollout status deploy/api --timeout=600s
          kubectl -n "${{ needs.build.outputs.namespace }}" rollout status deploy/web --timeout=600s

      - name: Wait until the URL answers
        env:
          HOST: ${{ needs.build.outputs.host }}
        run: |
          for i in $(seq 1 60); do
            code=$(curl -s -o /dev/null -w '%{http_code}' "https://$HOST/api/health/" || true)
            if [ "$code" = "200" ]; then echo "https://$HOST is up"; exit 0; fi
            echo "attempt $i: HTTP $code, waiting for the load balancer rule and DNS..."; sleep 10
          done
          echo "Preview never became healthy"; exit 1

      - name: Post the URL on the pull request
        uses: marocchino/sticky-pull-request-comment@v2
        with:
          header: preview
          message: |
            ### Preview environment
            :rocket: **https://${{ needs.build.outputs.host }}**

            Namespace `${{ needs.build.outputs.namespace }}` on `${{ env.EKS_CLUSTER }}`, built from `${{ needs.build.outputs.sha_short }}`.
            It is redeployed on every push and deleted when this PR is closed.
      - name: Deploy (not implemented yet)
        run: |
          echo "Images are built: ${{ needs.build.outputs.api_image }}"
          echo "Nothing is deployed yet. Complete Lab 3a to deploy to https://${{ needs.build.outputs.host }}"
