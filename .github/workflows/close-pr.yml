name: Post-Merge PR Actions

on:
  pull_request:
    types:
      - closed

jobs:
  delete-testery-environment:
    if: github.event.pull_request.head.ref != 'main' && github.event.pull_request.head.ref != 'develop'
    runs-on: ubuntu-latest

    env:
      BRANCH_NAME: ${{ github.event.pull_request.head.ref }}

    steps:
      - name: Safe branch name
        run: |
          SAFE_PREFIX="${BRANCH_NAME//\//-}"
          SAFE_PREFIX="${SAFE_PREFIX,,}"
          echo "SAFE_BRANCH_NAME=${SAFE_PREFIX}" >> $GITHUB_ENV

      - name: Install Testery CLI
        run: |
          python -m pip install --upgrade pip
          pip install testery --upgrade

      - name: Delete Testery Environment
        continue-on-error: true
        run: |
          testery delete-environment --token "${{ secrets.TESTERY_TOKEN }}" --key ${{ env.SAFE_BRANCH_NAME }}
