name: Deploy to Prod

on:
  workflow_dispatch:
    inputs:
      version:
        description: 'Octopus Release version to deploy (must have been deployed to Development first)'
        required: true
        type: string

concurrency:
  group: deploy-prod
  cancel-in-progress: false

permissions:
  contents: read
  id-token: write # Required by Octopus login action
  actions: write # Required to trigger workflow_dispatch

jobs:
  deploy-to-prod:
    runs-on: ubuntu-24.04
    env:
      OCTOPUS_SPACE: 'Default'

    steps:
    - name: Log into Octopus Deploy 🐙
      uses: OctopusDeploy/login@v2
      with:
        server: ${{ vars.OCTOPUS_DOMAIN }}
        service_account_id: ${{ secrets.OCTOPUS_SERVICE_ID }}

    - name: Deploy the prod environment release 🐙
      id: deploy_release
      uses: OctopusDeploy/deploy-release-action@v4
      with:
        project: 'Archetype Deploy'
        release_number: ${{ inputs.version }}
        environments: |
          Production

    - name: Await task in Octopus Deploy 🐙
      uses: OctopusDeploy/await-task-action@v4
      with:
        server_task_id: ${{ fromJson(steps.deploy_release.outputs.server_tasks)[0].serverTaskId }}
