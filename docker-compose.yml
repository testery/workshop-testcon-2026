services:
  db:
    image: postgres:16
    restart: unless-stopped
    environment:
      POSTGRES_DB: ${POSTGRES_DB:-example_webapp}
      POSTGRES_USER: ${POSTGRES_USER:-example_webapp}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-example_webapp}
    volumes:
      - pgdata:/var/lib/postgresql/data
    ports:
      - "5432:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-example_webapp}"]
      interval: 5s
      timeout: 5s
      retries: 10

  api:
    build: ./api
    restart: unless-stopped
    environment:
      DATABASE_URL: ${DATABASE_URL:-postgres://example_webapp:example_webapp@db:5432/example_webapp}
      SECRET_KEY: ${SECRET_KEY:-insecure-dev-key-change-me}
      DEBUG: ${DEBUG:-1}
      ALLOWED_HOSTS: ${ALLOWED_HOSTS:-*}
      CORS_ALLOWED_ORIGINS: ${CORS_ALLOWED_ORIGINS:-http://localhost:5173}
      AUTH0_DOMAIN: ${AUTH0_DOMAIN:-}
      AUTH0_CLIENT_ID: ${AUTH0_CLIENT_ID:-}
      AUTH0_CLIENT_SECRET: ${AUTH0_CLIENT_SECRET:-}
      AUTH0_CALLBACK_URL: ${AUTH0_CALLBACK_URL:-http://localhost:8000/api/auth/callback}
      POST_LOGOUT_REDIRECT: ${POST_LOGOUT_REDIRECT:-http://localhost:5173/}
      ANTHROPIC_API_KEY: ${ANTHROPIC_API_KEY:-}
      AGENT_RUNNER_BACKEND: ${AGENT_RUNNER_BACKEND:-}
    ports:
      - "8000:8000"
    depends_on:
      db:
        condition: service_healthy

  web:
    build: ./web
    restart: unless-stopped
    ports:
      - "5173:80"
    depends_on:
      - api

volumes:
  pgdata:
