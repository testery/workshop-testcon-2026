services:
  db:
    image: postgres:16-alpine
    restart: unless-stopped
    environment:
      POSTGRES_DB: example_webapp
      POSTGRES_USER: example_webapp
      POSTGRES_PASSWORD: example_webapp
    volumes:
      - pgdata:/var/lib/postgresql/data
    ports:
      - "5432:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U example_webapp"]
      interval: 5s
      timeout: 5s
      retries: 10

  api:
    build: ./api
    restart: unless-stopped
    command: sh -c "python manage.py migrate --noinput && python manage.py seed_demo_data && gunicorn config.wsgi --bind 0.0.0.0:8000 --workers 2"
    environment:
      DATABASE_URL: postgres://example_webapp:example_webapp@db:5432/example_webapp
      SECRET_KEY: insecure-dev-key-change-me
      DEBUG: "1"
      ALLOWED_HOSTS: "*"
      CORS_ALLOWED_ORIGINS: http://localhost:5173
      DEMO_LOGIN_ENABLED: "1"
    ports:
      - "8000:8000"
    depends_on:
      db:
        condition: service_healthy

  web:
    build: ./web
    restart: unless-stopped
    ports:
      - "5173:80"
    depends_on:
      - api

volumes:
  pgdata:
