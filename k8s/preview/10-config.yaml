# Per-environment configuration. In a real system the Secret would come from a vault or
# external-secrets operator; for a throwaway preview a generated value is fine.
apiVersion: v1
kind: ConfigMap
metadata:
  name: app-config
  namespace: ${NAMESPACE}
data:
  DATABASE_URL: postgres://example_webapp:example_webapp@db:5432/example_webapp
  DEBUG: "0"
  DEMO_LOGIN_ENABLED: "1"
  ALLOWED_HOSTS: "*"
  CORS_ALLOWED_ORIGINS: https://${HOST}
  CSRF_TRUSTED_ORIGINS: https://${HOST}
  PUBLIC_URL: https://${HOST}
---
apiVersion: v1
kind: Secret
metadata:
  name: app-secrets
  namespace: ${NAMESPACE}
type: Opaque
stringData:
  SECRET_KEY: preview-${NAMESPACE}-${GIT_SHA_SHORT}
  POSTGRES_PASSWORD: example_webapp
