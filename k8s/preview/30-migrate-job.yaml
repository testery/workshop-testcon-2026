# Runs once per deploy. The name includes the commit so each deploy gets a fresh Job
# (Job templates are immutable). Retries cover the window while Postgres is still starting.
apiVersion: batch/v1
kind: Job
metadata:
  name: migrate-${GIT_SHA_SHORT}
  namespace: ${NAMESPACE}
spec:
  backoffLimit: 8
  ttlSecondsAfterFinished: 900
  template:
    spec:
      restartPolicy: OnFailure
      containers:
        - name: migrate
          image: ${API_IMAGE}
          command: ["sh", "-c"]
          args:
            - python manage.py migrate --noinput
          envFrom:
            - configMapRef: { name: app-config }
            - secretRef: { name: app-secrets }
          resources:
            requests: { cpu: 250m, memory: 512Mi }
            limits: { cpu: 500m, memory: 512Mi }
